name: Live LLM Verification

on:
  workflow_dispatch:

jobs:
  verify-live-openai-path:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Require configured OpenAI credential
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY GitHub Actions secret is not configured."
            exit 2
          fi

      - name: Execute real Responses API + function-calling verification
        run: python scripts/verify_live_llm.py
